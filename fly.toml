# fly.toml app configuration file generated for when-all on 2026-05-01T02:35:12Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'when-all'
primary_region = 'ewr'

[build]

[env]
  DATA_FILE = '/data/events.json'
  PORT = '8080'

[[mounts]]
  source = 'whenall_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
